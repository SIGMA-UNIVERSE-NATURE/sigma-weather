<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sigma Weather Two Panels</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <img class="background" src="../generated_images/call_vsKOoyUaTcaylS2j1Gs3k34A.png" alt="" />
      <div class="mist mist-one"></div>
      <div class="mist mist-two"></div>
      <div class="sun"></div>

      <section class="layout" aria-label="Sigma weather website preview">
        <article class="panel weather-card">
          <p class="kicker">SIGMA WEATHER</p>
          <h1>Báo thời tiết toàn cầu</h1>
          <div class="weather-now">
            <div>
              <span class="city">Ho Chi Minh City</span>
              <strong>29°C</strong>
            </div>
            <span class="condition">Mưa nhẹ</span>
          </div>
          <div class="metrics">
            <span>Độ ẩm <b>78%</b></span>
            <span>Gió <b>12 km/h</b></span>
            <span>UV <b>4</b></span>
          </div>
          <div class="forecast">
            <span>Mon<br /><b>30°</b></span>
            <span>Tue<br /><b>29°</b></span>
            <span>Wed<br /><b>31°</b></span>
            <span>Thu<br /><b>28°</b></span>
          </div>
        </article>

        <article class="panel background-card">
          <p class="kicker">BACKGROUND</p>
          <h2>Rừng tre Sigma</h2>
          <div class="preview-window">
            <img src="../generated_images/call_vsKOoyUaTcaylS2j1Gs3k34A.png" alt="Sigma bamboo forest background preview" />
          </div>
          <p class="note">Nền phía sau dùng cho cảm giác sống, trí tuệ, bình an. Ô thời tiết phía trước dùng cho dữ liệu thật.</p>
        </article>
      </section>
    </main>
  </body>
</html>
