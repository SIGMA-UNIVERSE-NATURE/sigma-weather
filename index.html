<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🌿 SIGMA CLIMATE – Global Weather Forecast</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0f1f0f;
            color: #e8f0d0;
        }

        /* ===== BACKGROUND ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/images/background.png') center/cover no-repeat fixed;
           /* filter: brightness(0.55) saturate(0.8); */
            z-index: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 30, 10, 0.55);
           /* backdrop-filter: blur(3px); */
            z-index: 1;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 1100px;
            width: 100%;
            position: relative;
            z-index: 2;
            background: rgba(20, 40, 20, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 30px 35px;
            border: 1px solid rgba(180, 220, 140, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            background: #2e4d2a;
            color: #c8e6b5;
            padding: 6px 24px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid #5a8f4a;
        }

        .header h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ebf5e0;
            margin-top: 6px;
        }

        .header h1 span {
            color: #b8d9a0;
            text-shadow: 0 0 20px rgba(180, 220, 140, 0.3);
        }

        .motto {
            font-size: 15px;
            color: #b0cba0;
            font-style: italic;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        /* ===== WEATHER ICONS ===== */
        .weather-icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 20px 0 28px;
        }

        .weather-icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid rgba(180, 220, 140, 0.15);
            transition: 0.3s;
        }

        .weather-icon-item:hover {
            transform: translateY(-4px);
            background: rgba(180, 220, 140, 0.1);
            border-color: #b8d9a0;
        }

        .weather-icon-item .icon {
            font-size: 32px;
            line-height: 1;
        }

        .weather-icon-item .label {
            font-size: 13px;
            font-weight: 500;
            color: #d0e8c0;
        }

        /* ===== SEARCH ===== */
        .search-section {
            margin: 16px 0 24px;
            text-align: center;
        }

        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .search-box select {
            flex: 1;
            min-width: 220px;
            padding: 14px 20px;
            border-radius: 60px;
            border: none;
            background: rgba(30, 60, 30, 0.6);
            color: #ebf5e0;
            font-size: 16px;
            outline: none;
            border: 1px solid rgba(180, 220, 140, 0.15);
            cursor: pointer;
            appearance: none;
        }

        .search-box select:focus {
            background: rgba(40, 80, 40, 0.7);
            border-color: #8cb87a;
        }

        .search-box select option {
            background: #1a3a1a;
            color: #ebf5e0;
        }

        .search-box button {
            padding: 14px 32px;
            border-radius: 60px;
            border: none;
            background: #4d7a3a;
            color: #f0f7e6;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #6a9e56;
        }

        .search-box button:hover {
            background: #5f9248;
            transform: scale(1.02);
        }

        /* ===== RESULT ===== */
        .result-container {
            margin-top: 20px;
        }

        .city-title {
            font-size: 24px;
            font-weight: 600;
            color: #c8e0b8;
            text-align: center;
            margin-bottom: 16px;
        }

        .chart-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .chart-container img {
            max-width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(180, 220, 140, 0.1);
        }

        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(20, 40, 20, 0.4);
            border-radius: 16px;
            overflow: hidden;
        }

        .forecast-table th {
            background: #2a4a2a;
            color: #d0e8c0;
            padding: 12px;
            font-weight: 600;
        }

        .forecast-table td {
            padding: 10px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(180, 220, 140, 0.05);
            color: #d0e0c0;
        }

        .forecast-table tr:hover td {
            background: rgba(180, 220, 140, 0.05);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            font-size: 13px;
            color: #5a7a4a;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(180, 220, 140, 0.08);
        }

        .footer a {
            color: #8cb87a;
            text-decoration: none;
        }

        .footer a:hover {
            color: #b8d9a0;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #88a87a;
            font-size: 18px;
        }

        .error-msg {
            text-align: center;
            padding: 30px;
            color: #e8b0a0;
            font-size: 18px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }
            .header h1 {
                font-size: 28px;
            }
            .search-box select {
                min-width: 140px;
            }
            .weather-icons {
                gap: 12px;
            }
            .weather-icon-item {
                padding: 4px 12px;
            }
            .weather-icon-item .icon {
                font-size: 24px;
            }
            .weather-icon-item .label {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="badge">🌱 Sigma Climate</div>
            <h1>🌿 SIGMA <span>FOREST</span></h1>
            <div class="motto">✨ Peaceful Mind. Kind Heart. Keep Growing.</div>
        </div>

        <!-- WEATHER ICONS (instead of characters) -->
        <div class="weather-icons">
            <div class="weather-icon-item">
                <span class="icon">☀️</span>
                <span class="label">Sunny</span>
            </div>
            <div class="weather-icon-item">
                <span class="icon">🌧️</span>
                <span class="label">Rainy</span>
            </div>
            <div class="weather-icon-item">
                <span class="icon">💨</span>
                <span class="label">Windy</span>
            </div>
            <div class="weather-icon-item">
                <span class="icon">⛈️</span>
                <span class="label">Storm</span>
            </div>
        </div>

        <!-- SEARCH -->
        <div class="search-section">
            <div class="search-box">
                <select id="citySelect">
                    <option value="Hanoi">Hanoi</option>
                    <option value="Ho Chi Minh City">Ho Chi Minh City</option>
                    <option value="Da Nang">Da Nang</option>
                    <option value="Hai Phong">Hai Phong</option>
                    <option value="Can Tho">Can Tho</option>
                    <option value="Tokyo">Tokyo</option>
                    <option value="Osaka">Osaka</option>
                    <option value="Seoul">Seoul</option>
                    <option value="Busan">Busan</option>
                    <option value="Beijing">Beijing</option>
                    <option value="Shanghai">Shanghai</option>
                    <option value="Hong Kong">Hong Kong</option>
                    <option value="Singapore">Singapore</option>
                    <option value="Kuala Lumpur">Kuala Lumpur</option>
                    <option value="Jakarta">Jakarta</option>
                    <option value="Bangkok">Bangkok</option>
                    <option value="Manila">Manila</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Dubai">Dubai</option>
                    <option value="Istanbul">Istanbul</option>
                    <option value="London">London</option>
                    <option value="Paris">Paris</option>
                    <option value="Berlin">Berlin</option>
                    <option value="Madrid">Madrid</option>
                    <option value="Rome">Rome</option>
                    <option value="Moscow">Moscow</option>
                    <option value="New York">New York</option>
                    <option value="Los Angeles">Los Angeles</option>
                    <option value="Chicago">Chicago</option>
                    <option value="Toronto">Toronto</option>
                    <option value="Mexico City">Mexico City</option>
                    <option value="Sao Paulo">Sao Paulo</option>
                    <option value="Rio de Janeiro">Rio de Janeiro</option>
                    <option value="Buenos Aires">Buenos Aires</option>
                    <option value="Lima">Lima</option>
                    <option value="Bogota">Bogota</option>
                    <option value="Cairo">Cairo</option>
                    <option value="Lagos">Lagos</option>
                    <option value="Nairobi">Nairobi</option>
                    <option value="Cape Town">Cape Town</option>
                    <option value="Johannesburg">Johannesburg</option>
                    <option value="Sydney">Sydney</option>
                    <option value="Melbourne">Melbourne</option>
                    <option value="Auckland">Auckland</option>
                </select>
                <button onclick="loadCityData()">🔍 Search</button>
            </div>
        </div>

        <!-- RESULT -->
        <div class="result-container" id="resultContainer">
            <div class="loading">🌿 Select a city and click "Search"</div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            ⚡ <a href="https://sigmauniverse.net" target="_blank">Sigma Universe</a> – <a href="https://sigmaclimate.net" target="_blank">sigmaclimate.net</a> &nbsp;|&nbsp; Data from Open-Meteo & NOAA
        </div>
    </div>

    <script>
        // ============================================================
        // LOAD CITY DATA
        // ============================================================
        function loadCityData() {
            const select = document.getElementById('citySelect');
            const city = select.value;
            const resultDiv = document.getElementById('resultContainer');

            const safeName = city.toLowerCase().replace(/ /g, '_').replace(/'/g, '');
            const imgUrl = `data/${safeName}_temperature_trend.png`;
            const csvUrl = `data/${safeName}_forecast_2025_2034.csv`;

            resultDiv.innerHTML = `<div class="loading">⏳ Loading data for ${city}...</div>`;

            fetch(imgUrl, { method: 'HEAD' })
                .then(res => {
                    if (res.ok) {
                        displayResult(city, imgUrl, csvUrl);
                    } else {
                        const altName = city.toLowerCase().replace(/ /g, '_');
                        const altImg = `data/${altName}_temperature_trend.png`;
                        fetch(altImg, { method: 'HEAD' })
                            .then(res2 => {
                                if (res2.ok) {
                                    displayResult(city, altImg, `data/${altName}_forecast_2025_2034.csv`);
                                } else {
                                    resultDiv.innerHTML = `<div class="error-msg">❌ No data found for "${city}".<br>Please try another city.</div>`;
                                }
                            })
                            .catch(() => {
                                resultDiv.innerHTML = `<div class="error-msg">❌ No data found for "${city}".</div>`;
                            });
                    }
                })
                .catch(() => {
                    resultDiv.innerHTML = `<div class="error-msg">❌ No data found for "${city}".</div>`;
                });
        }

        function displayResult(city, imgUrl, csvUrl) {
            const resultDiv = document.getElementById('resultContainer');

            let html = `
                <div class="city-title">📍 ${city.toUpperCase()}</div>
                <div class="chart-container">
                    <img src="${imgUrl}" alt="Temperature trend for ${city}" onerror="this.style.display='none'">
                </div>
                <div style="text-align:center;color:#88a87a;font-size:14px;margin-bottom:12px;">
                    📊 Temperature trend 2015-2034 | 🔮 Forecast 2025-2034
                </div>
            `;

            fetch(csvUrl)
                .then(res => res.text())
                .then(text => {
                    const lines = text.trim().split('\n');
                    if (lines.length > 1) {
                        html += `<table class="forecast-table">
                            <tr><th>Year</th><th>Forecast Temperature (°C)</th></tr>`;
                        for (let i = 1; i < lines.length && i <= 10; i++) {
                            const cols = lines[i].split(',');
                            if (cols.length >= 2) {
                                html += `<tr><td>${cols[0]}</td><td>${parseFloat(cols[1]).toFixed(2)}°C</td></tr>`;
                            }
                        }
                        html += `</table>`;
                    }
                    resultDiv.innerHTML = html;
                })
                .catch(() => {
                    resultDiv.innerHTML = html + `<div style="color:#88a87a;text-align:center;padding:12px;">ℹ️ No forecast data available.</div>`;
                });
        }

        // Auto-load on page load
        window.onload = loadCityData;
    </script>
</body>
</html>
