<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌿 SIGMA CLIMATE – Vietnam + 150 Cities</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>

    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
            background: #0a1a0a;
            color: #e8f0d0;
        }

        /* ============================================================
           BACKGROUND RỪNG TRE + NHÂN VẬT SIGMA
           ============================================================ */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/images/background.jpg') center/cover no-repeat fixed;
            filter: brightness(0.8) saturate(0.95) contrast(1.05);
            z-index: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 30, 10, 0.15);
            backdrop-filter: blur(2px);
            z-index: 1;
        }

        /* ============================================================
           CONTAINER CHÍNH
           ============================================================ */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            background: rgba(20, 40, 20, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 30px 35px;
            border: 1px solid rgba(180, 220, 140, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .logo-sigma {
            height: 50px;
            display: block;
            margin: 0 auto 8px;
            filter: drop-shadow(0 0 20px rgba(180, 220, 140, 0.2));
        }

        .badge {
            display: inline-block;
            background: rgba(46, 77, 42, 0.5);
            color: #c8e6b5;
            padding: 4px 20px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid rgba(90, 143, 74, 0.25);
            backdrop-filter: blur(4px);
        }

        .header h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ebf5e0;
            margin-top: 4px;
            text-shadow: 0 2px 30px rgba(0, 0, 0, 0.4);
        }

        .header h1 span {
            color: #b8d9a0;
            text-shadow: 0 0 40px rgba(180, 220, 140, 0.2);
        }

        .motto {
            font-size: 14px;
            color: #d0e8c0;
            font-style: italic;
            margin-top: 2px;
            letter-spacing: 1px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        /* ============================================================
           WEATHER ICONS
           ============================================================ */
        .weather-icons {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin: 16px 0 20px;
        }

        .weather-icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(180, 220, 140, 0.08);
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }

        .weather-icon-item:hover {
            transform: translateY(-3px);
            background: rgba(180, 220, 140, 0.08);
            border-color: #b8d9a0;
        }

        .weather-icon-item .icon {
            font-size: 28px;
            line-height: 1;
        }

        .weather-icon-item .label {
            font-size: 12px;
            font-weight: 500;
            color: #d0e8c0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* ============================================================
           SECTION TITLE
           ============================================================ */
        .section-title {
            font-size: 19px;
            font-weight: 600;
            color: #c8e0b8;
            margin: 18px 0 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(180, 220, 140, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* ============================================================
           PHẦN 1: VIỆT NAM
           ============================================================ */
        .vietnam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
            margin-bottom: 4px;
        }

        .vietnam-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 14px 12px;
            text-align: center;
            border: 1px solid rgba(180, 220, 140, 0.05);
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }

        .vietnam-card:hover {
            transform: translateY(-3px);
            background: rgba(180, 220, 140, 0.06);
            border-color: rgba(180, 220, 140, 0.15);
        }

        .vietnam-card .city-name {
            font-size: 15px;
            font-weight: 600;
            color: #d0e8c0;
        }

        .vietnam-card .temp {
            font-size: 28px;
            font-weight: 700;
            color: #ebf5e0;
            margin: 2px 0 0px;
        }

        .vietnam-card .temp sup {
            font-size: 14px;
            font-weight: 400;
            color: #88a87a;
        }

        .vietnam-card .detail {
            font-size: 12px;
            color: #88a87a;
            line-height: 1.5;
        }

        .vietnam-card .detail span {
            color: #b8d9a0;
        }

        .vietnam-card .uv-badge {
            display: inline-block;
            padding: 1px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 3px;
        }

        .uv-low {
            background: rgba(46, 204, 113, 0.2);
            color: #a3e4d7;
        }
        .uv-moderate {
            background: rgba(241, 196, 15, 0.2);
            color: #f9e79f;
        }
        .uv-high {
            background: rgba(231, 76, 60, 0.2);
            color: #f1948a;
        }
        .uv-extreme {
            background: rgba(155, 89, 182, 0.25);
            color: #d7bde2;
        }

        .last-updated {
            text-align: right;
            font-size: 11px;
            color: #5a7a4a;
            margin-top: 2px;
            font-style: italic;
        }

        /* ============================================================
           PHẦN 2: 150 THÀNH PHỐ
           ============================================================ */
        .search-section {
            margin: 14px 0 18px;
            text-align: center;
        }

        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .search-box select,
        .search-box input {
            flex: 1;
            min-width: 160px;
            padding: 11px 16px;
            border-radius: 60px;
            border: none;
            background: rgba(30, 60, 30, 0.45);
            color: #ebf5e0;
            font-size: 14px;
            outline: none;
            border: 1px solid rgba(180, 220, 140, 0.08);
            backdrop-filter: blur(4px);
        }

        .search-box select:focus,
        .search-box input:focus {
            background: rgba(40, 80, 40, 0.55);
            border-color: #8cb87a;
        }

        .search-box select option {
            background: #1a3a1a;
            color: #ebf5e0;
        }

        .search-box button {
            padding: 11px 24px;
            border-radius: 60px;
            border: none;
            background: rgba(77, 122, 58, 0.75);
            color: #f0f7e6;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(106, 158, 86, 0.25);
            backdrop-filter: blur(4px);
        }

        .search-box button:hover {
            background: rgba(95, 146, 72, 0.85);
            transform: scale(1.02);
        }

        /* ============================================================
           CITY RESULT
           ============================================================ */
        .city-result {
            margin-top: 14px;
        }

        .city-title {
            font-size: 21px;
            font-weight: 600;
            color: #c8e0b8;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .favorite-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.3));
        }

        .favorite-btn:hover {
            transform: scale(1.15);
        }

        .chart-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(180, 220, 140, 0.04);
        }

        .chart-container canvas {
            max-width: 100%;
            max-height: 360px;
        }

        .chart-label {
            text-align: center;
            color: #88a87a;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .warning-box {
            margin: 10px 0 14px;
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: 600;
            text-align: center;
            backdrop-filter: blur(4px);
            font-size: 13px;
        }

        .warning-box.green {
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid rgba(46, 204, 113, 0.2);
            color: #a3e4d7;
        }

        .warning-box.yellow {
            background: rgba(241, 196, 15, 0.1);
            border: 1px solid rgba(241, 196, 15, 0.2);
            color: #f9e79f;
        }

        .warning-box.red {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.2);
            color: #f1948a;
        }

        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(20, 40, 20, 0.2);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        .forecast-table th {
            background: rgba(42, 74, 42, 0.45);
            color: #d0e8c0;
            padding: 8px 10px;
            font-weight: 600;
            font-size: 13px;
        }

        .forecast-table td {
            padding: 6px 10px;
            text-align: center;
            border-bottom: 1px solid rgba(180, 220, 140, 0.03);
            color: #d0e0c0;
            font-size: 13px;
        }

        .forecast-table tr:hover td {
            background: rgba(180, 220, 140, 0.03);
        }

        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 7px 20px;
            background: rgba(46, 77, 42, 0.45);
            color: #c8e6b5;
            border: 1px solid rgba(90, 143, 74, 0.2);
            border-radius: 40px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            backdrop-filter: blur(4px);
        }

        .download-btn:hover {
            background: rgba(61, 106, 56, 0.6);
            transform: scale(1.02);
        }

        .loading,
        .error-msg {
            text-align: center;
            padding: 16px;
            font-size: 16px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .loading {
            color: #88a87a;
        }

        .error-msg {
            color: #e8b0a0;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            text-align: center;
            font-size: 11px;
            color: #5a7a4a;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(180, 220, 140, 0.05);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .footer a {
            color: #8cb87a;
            text-decoration: none;
            transition: 0.3s;
        }

        .footer a:hover {
            color: #b8d9a0;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            .container {
                padding: 16px;
                border-radius: 28px;
            }
            .header h1 {
                font-size: 26px;
            }
            .vietnam-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 10px;
            }
            .vietnam-card .temp {
                font-size: 24px;
            }
            .search-box select,
            .search-box input {
                min-width: 110px;
                font-size: 13px;
                padding: 10px 12px;
            }
            .search-box button {
                padding: 10px 18px;
                font-size: 13px;
            }
            .city-title {
                font-size: 18px;
            }
            .section-title {
                font-size: 16px;
            }
            .forecast-table th,
            .forecast-table td {
                padding: 5px 6px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .vietnam-grid {
                grid-template-columns: 1fr 1fr;
            }
            .search-box {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box select,
            .search-box input,
            .search-box button {
                min-width: unset;
                width: 100%;
            }
            .container {
                padding: 12px;
                border-radius: 20px;
            }
            .header h1 {
                font-size: 22px;
            }
            .logo-sigma {
                height: 40px;
            }
            .weather-icons {
                gap: 10px;
            }
            .weather-icon-item {
                padding: 4px 10px;
            }
            .weather-icon-item .icon {
                font-size: 22px;
            }
            .weather-icon-item .label {
                font-size: 10px;
            }
        }
    </style>
</head>

                    <option value="3">3 Years</option>
                    <option value="5" selected>5 Years</option>

                <button onclick="loadCityData()">🔍 Search</button>
            </div>
        </div>

        <div class="city-result" id="cityResult">
            <div class="loading">🌿 Select a city and click "Search"</div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            ⚡ <a href="https://sigmauniverse.net" target="_blank">Sigma Universe</a> – <a href="https://sigmaclimate.net" target="_blank">sigmaclimate.net</a> &nbsp;|&nbsp; Data from Open-Meteo &amp; NOAA
        </div>
    </div>

        // VIETNAM CITIES (first 10)
        const VIETNAM_CITIES = CITIES.slice(0, 10);

        // ============================================================
        // BIẾN TOÀN CỤ
        // ============================================================
        let chartInstance = null;
        let currentCityName = '';
        let currentHistoricalData = [];
        let currentForecastData = [];

        // ============================================================
        // KHỞI TẠO DROPDOWN
        // ============================================================
        function initCityDropdown() {
            const select = document.getElementById('citySelect');
            const datalist = document.getElementById('cityList');

            CITIES.forEach(city => {
                const opt = document.createElement('option');
                opt.value = city.name;
                select.appendChild(opt);

                const opt2 = document.createElement('option');
                opt2.value = city.name;
                datalist.appendChild(opt2);
            });
        }

        function getCityCoords(name) {
            return CITIES.find(c => c.name.toLowerCase() === name.toLowerCase());
        }

        // ============================================================
        // PHẦN 1: VIỆT NAM WEATHER
        // ============================================================
        async function loadVietnamWeather() {
            const grid = document.getElementById('vietnamGrid');
            const updatedEl = document.getElementById('vietnamUpdated');

            try {
                const promises = VIETNAM_CITIES.map(async (city) => {
                    const url =
                        `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current_weather=true&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m,uv_index&timezone=auto`;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('API error');
                    const data = await res.json();

                    const temp = data.current_weather.temperature;
                    const wind = data.current_weather.windspeed;
                    const humidity = data.hourly.relative_humidity_2m[0] || '--';
                    const uv = data.hourly.uv_index[0] || 0;

                    let uvLevel = 'low';
                    let uvLabel = 'Low';
                    if (uv >= 8) { uvLevel = 'extreme';
                        uvLabel = 'Extreme'; } else if (uv >= 6) { uvLevel = 'high';
                        uvLabel = 'High'; } else if (uv >= 3) { uvLevel = 'moderate';
                        uvLabel = 'Moderate'; }

                    return { name: city.name, temp, wind, humidity, uv, uvLevel, uvLabel };
                });

                const results = await Promise.all(promises);

                grid.innerHTML = results.map(r => `
                    <div class="vietnam-card">
                        <div class="city-name">${r.name}</div>
                        <div class="temp">${Math.round(r.temp)}<sup>°C</sup></div>
                        <div class="detail">💧 ${r.humidity}% &nbsp;|&nbsp; 🌬️ ${r.wind} km/h</div>
                        <div><span class="uv-badge uv-${r.uvLevel}">☀️ UV ${r.uvLabel}</span></div>
                    </div>
                `).join('');

                updatedEl.textContent = `🔄 Updated: ${new Date().toLocaleString()}`;

            } catch (err) {
                console.error('Vietnam weather error:', err);
                grid.innerHTML = `<div class="error-msg">❌ Could not load Vietnam weather. Please try again later.</div>`;
            }
        }

        // ============================================================
        // PHẦN 2: LOAD CITY DATA
        // ============================================================
        function loadCityData() {
            const cityDropdown = document.getElementById('citySelect').value;
            const cityInput = document.getElementById('cityInput').value.trim();
            let cityName = cityDropdown || cityInput;

            if (!cityName) {
                document.getElementById('cityResult').innerHTML =
                    `<div class="error-msg">❌ Please select or type a city.</div>`;
                return;
            }

            const coords = getCityCoords(cityName);
            if (!coords) {
                document.getElementById('cityResult').innerHTML =
                    `<div class="error-msg">❌ City "${cityName}" not found.</div>`;
                return;
            }

            currentCityName = cityName;
            const years = parseInt(document.getElementById('yearSelect').value);
            const resultDiv = document.getElementById('cityResult');
            resultDiv.innerHTML = `<div class="loading">⏳ Loading data for ${cityName}...</div>`;

            // Gọi API Archive để lấy dữ liệu 2015-2024
            const url =
                `https://archive-api.open-meteo.com/v1/archive?latitude=${coords.lat}&longitude=${coords.lon}&start_date=2015-01-01&end_date=2024-12-31&daily=temperature_2m_mean&timezone=auto`;

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error('API error');
                    return res.json();
                })
                .then(data => {
                    if (!data.daily || !data.daily.time || data.daily.time.length === 0) {
                        throw new Error('No data available');
                    }

                    // Tính nhiệt độ trung bình năm
                    const yearsMap = {};
                    data.daily.time.forEach((date, idx) => {
                        const year = parseInt(date.split('-')[0]);
                        const temp = data.daily.temperature_2m_mean[idx];
                        if (!yearsMap[year]) yearsMap[year] = [];
                        yearsMap[year].push(temp);
                    });

                    const yearlyData = Object.keys(yearsMap).sort().map(year => {
                        const temps = yearsMap[year];
                        const avg = temps.reduce((a, b) => a + b, 0) / temps.length;
                        return { year: parseInt(year), temp: avg };
                    });

                    if (yearlyData.length < 2) {
                        throw new Error('Insufficient data');
                    }

                    // Dự báo 2025-2034
                    const forecast = forecastTemperature(yearlyData);
                    currentHistoricalData = yearlyData;
                    currentForecastData = forecast;

                    displayCityResult(cityName, yearlyData, forecast, years);

                })
                .catch(err => {
                    console.error('City data error:', err);
                    resultDiv.innerHTML =
                        `<div class="error-msg">❌ Could not load data for "${cityName}".<br>Please try another city.</div>`;
                });
        }

        // ============================================================
        // HỒI QUY TUYẾN TÍNH
        // ============================================================
        function forecastTemperature(historicalData) {
            const n = historicalData.length;
            if (n < 2) return [];

            const sumX = historicalData.reduce((s, d) => s + d.year, 0);
            const sumY = historicalData.reduce((s, d) => s + d.temp, 0);
            const sumXY = historicalData.reduce((s, d) => s + d.year * d.temp, 0);
            const sumX2 = historicalData.reduce((s, d) => s + d.year * d.year, 0);

            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;

            const forecast = [];
            for (let year = 2025; year <= 2034; year++) {
                forecast.push({ year, temp: slope * year + intercept, slope, intercept });
            }
            return forecast;
        }

        // ============================================================
        // HIỂN THỊ KẾT QUẢ
        // ============================================================
        function displayCityResult(cityName, historicalData, forecastData, years) {
            const resultDiv = document.getElementById('cityResult');

            const startYear = 2025;
            const endYear = startYear + years - 1;
            const filteredForecast = forecastData.filter(d => d.year >= startYear && d.year <= endYear);

            const slope = forecastData.length > 0 ? forecastData[0].slope : 0;

            let warningLevel = 'green';
            let warningMessage = '✅ Climate in this region is stable.';
            if (slope > 0.03) {
                warningLevel = 'red';
                warningMessage = '🔴 WARNING: This region is warming faster than the global average (> 0.03°C/year). Prepare for more extreme summers.';
            } else if (slope > 0.02) {
                warningLevel = 'yellow';
                warningMessage = '🟡 CAUTION: This region is showing signs of warming. Monitor closely.';
            }

            const favorites = JSON.parse(localStorage.getItem('favoriteCities') || '[]');
            const isFavorite = favorites.includes(cityName);
            const favBtnHtml =
                `<button class="favorite-btn" onclick="toggleFavorite('${cityName}')">${isFavorite ? '❤️' : '🤍'}</button>`;

            let html = `
                <div class="city-title">
                    <span>📍 ${cityName.toUpperCase()}</span>
                    ${favBtnHtml}
                </div>
                <div class="chart-container">
                    <canvas id="cityChart"></canvas>
                </div>
                <div class="chart-label">
                    📊 Temperature trend 2015-2024 | 🔮 Forecast ${startYear}-${endYear}
                    ${slope !== 0 ? `| Trend: ${(slope * 100).toFixed(2)}°C/100 years` : ''}
                </div>
                <div class="warning-box ${warningLevel}">${warningMessage}</div>
                <div style="text-align:center;margin-bottom:10px;">
                    <button class="download-btn" onclick="downloadCSV('${cityName}')">⬇️ Download CSV</button>
                </div>
            `;

            if (filteredForecast.length > 0) {
                html += `<table class="forecast-table">
                    <tr><th>Year</th><th>Forecast Temperature (°C)</th></tr>`;
                filteredForecast.forEach(d => {
                    html += `<tr><td>${d.year}</td><td>${d.temp.toFixed(2)}°C</td></tr>`;
                });
                html += `</table>`;
            }

            resultDiv.innerHTML = html;

            // Render chart
            renderCityChart(historicalData, forecastData, startYear, endYear);
        }

        // ============================================================
        // VẼ BIỂU ĐỒ
        // ============================================================
        function renderCityChart(historicalData, forecastData, startYear, endYear) {
            const canvas = document.getElementById('cityChart');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            const allYears = [];
            const histTemps = [];
            const foreTemps = [];
            const upperBound = [];
            const lowerBound = [];

            for (let y = 2015; y <= 2034; y++) {
                allYears.push(y);
                const hist = historicalData.find(d => d.year === y);
                const fore = forecastData.find(d => d.year === y);

                if (hist) {
                    histTemps.push(hist.temp);
                    foreTemps.push(null);
                    upperBound.push(null);
                    lowerBound.push(null);
                } else if (fore) {
                    histTemps.push(null);
                    foreTemps.push(fore.temp);
                    upperBound.push(fore.temp + 0.5);
                    lowerBound.push(fore.temp - 0.5);
                } else {
                    histTemps.push(null);
                    foreTemps.push(null);
                    upperBound.push(null);
                    lowerBound.push(null);
                }
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: allYears,
                    datasets: [{
                        label: 'Historical Data',
                        data: histTemps,
                        borderColor: '#6a9e56',
                        backgroundColor: 'rgba(106, 158, 86, 0.05)',
                        fill: false,
                        tension: 0.3,
                        pointRadius: 3,
                        pointBackgroundColor: '#6a9e56',
                        spanGaps: false
                    }, {
                        label: 'Forecast',
                        data: foreTemps,
                        borderColor: '#f1c40f',
                        backgroundColor: 'rgba(241, 196, 15, 0.05)',
                        borderDash: [5, 5],
                        fill: false,
                        tension: 0.3,
                        pointRadius: 4,
                        pointBackgroundColor: '#f1c40f',
                        spanGaps: false
                    }, {
                        label: 'Confidence Interval',
                        data: upperBound,
                        borderColor: 'rgba(241, 196, 15, 0.0)',
                        backgroundColor: 'rgba(241, 196, 15, 0.12)',
                        fill: '+1',
                        pointRadius: 0,
                        borderWidth: 0,
                        tension: 0.3,
                        spanGaps: false
                    }, {
                        label: 'Confidence Interval (lower)',
                        data: lowerBound,
                        borderColor: 'rgba(241, 196, 15, 0.0)',
                        backgroundColor: 'rgba(241, 196, 15, 0.0)',
                        fill: false,
                        pointRadius: 0,
                        borderWidth: 0,
                        tension: 0.3,
                        spanGaps: false,
                        hidden: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#c8e0b8',
                                font: { size: 12 }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if (context.datasetIndex >= 2) return null;
                                    if (context.parsed.y === null) return null;
                                    return context.dataset.label + ': ' + context.parsed.y.toFixed(2) + '°C';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#88a87a',
                                maxTicksLimit: 10
                            },
                            grid: {
                                color: 'rgba(180, 220, 140, 0.05)'
                            }
                        },
                        y: {
                            ticks: {
                                color: '#88a87a',
                                callback: function(value) {
                                    return value.toFixed(1) + '°C';
                                }
                            },
                            grid: {
                                color: 'rgba(180, 220, 140, 0.05)'
                            }
                        }
                    },
                    elements: {
                        line: {
                            borderWidth: 2
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        // ============================================================
        // DOWNLOAD CSV (DỮ LIỆU THẬT)
        // ============================================================
        function downloadCSV(cityName) {
            if (currentForecastData.length === 0) {
                alert('No forecast data available. Please search for a city first.');
                return;
            }

            let csv = 'Year,Temperature_C\n';
            currentForecastData.forEach(d => {
                csv += `${d.year},${d.temp.toFixed(2)}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${cityName.toLowerCase()}_forecast_2025_2034.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        // ============================================================
        // YÊU THÍCH
        // ============================================================
        function toggleFavorite(cityName) {
            let favorites = JSON.parse(localStorage.getItem('favoriteCities') || '[]');
            const index = favorites.indexOf(cityName);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(cityName);
            }
            localStorage.setItem('favoriteCities', JSON.stringify(favorites));
            loadCityData();
        }

        // ============================================================
        // HỖ TRỢ ENTER
        // ============================================================
        document.getElementById('cityInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                loadCityData();
            }
        });

        // ============================================================
        // KHỞI CHẠY
        // ============================================================
        window.onload = function() {
            initCityDropdown();
            loadVietnamWeather();
            // Mặc định Hà Nội
            document.getElementById('citySelect').value = 'Hanoi';
            loadCityData();
        };
