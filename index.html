<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGMA CLIMATE – Cảnh báo mưa lũ Việt Nam</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --midnight: #020A18;
            --cyan: #38DFFF;
            --soft-cyan: #8EF6FF;
            --ice: #DFFBFF;
            --silver: #F8FBFF;
            --gold: #F4C542;
            --muted: #A9D7E6;
            --alert: #FF8F4C;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            font-family: Inter, system-ui, sans-serif;
            color: var(--silver);
            background: #020A18;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px 18px;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url("assets/images/background.jpg") center/cover no-repeat fixed;
            filter: brightness(.92) saturate(1.12);
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 50% 12%, rgba(56, 223, 255, .08), transparent 32%),
                linear-gradient(180deg, rgba(2, 10, 24, .02), rgba(2, 10, 24, .22));
            z-index: -1;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            padding: 28px 24px;
            text-align: center;
        }
        .logo {
            width: min(360px, 70vw);
            height: auto;
            display: block;
            margin: 0 auto 8px;
            filter: drop-shadow(0 18px 38px rgba(56, 223, 255, .22));
        }
        .title {
            font-family: Cinzel, serif;
            font-size: clamp(28px, 5vw, 56px);
            font-weight: 500;
           /* letter-spacing: .18em; */
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, #F8FBFF 30%, #DFFBFF 55%, #8EF6FF 78%, #426E94 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 18px rgba(56, 223, 255, .35);
        }
        .subtitle {
            font-family: Cinzel, serif;
            color: var(--gold);
            letter-spacing: .34em;
            text-transform: uppercase;
            font-size: clamp(12px, 1.6vw, 18px);
            text-shadow: 0 0 16px rgba(244, 197, 66, .35);
            margin-bottom: 12px;
        }
        .data-source-banner {
            background: rgba(56, 223, 255, 0.08);
            border: 1px solid rgba(56, 223, 255, 0.25);
            border-radius: 40px;
            padding: 10px 18px;
            margin: 10px auto 16px;
            max-width: 800px;
            font-size: clamp(11px, 1.2vw, 15px);
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--soft-cyan);
            text-shadow: 0 0 18px rgba(56, 223, 255, 0.3);
            backdrop-filter: blur(4px);
            display: inline-block;
        }
        .data-source-banner strong {
            color: var(--gold);
            font-family: Cinzel, serif;
        }
        .language {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 12px 0;
            color: var(--gold);
            font-weight: 700;
        }
        select,
        input,
        button {
            font: inherit;
        }
        .language select {
            background: transparent;
            color: var(--ice);
            border: 0;
            outline: 0;
            font-weight: 700;
            text-align: center;
        }
        .language option {
            background: #020A18;
            color: #fff;
        }
        .city {
            font-family: Cinzel, serif;
            font-size: clamp(20px, 4vw, 30px);
            color: var(--ice);
            letter-spacing: .14em;
            text-shadow: 0 0 18px rgba(56, 223, 255, .4);
            margin: 10px 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        #countryFlag {
            width: 48px;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(56, 223, 255, .2);
            vertical-align: middle;
        }
        .search {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 14px;
            margin: 18px auto 24px;
            max-width: 780px;
        }
        .search input {
            background: transparent;
            border: 0;
            border-bottom: 1px solid rgba(216, 251, 255, .35);
            color: var(--ice);
            padding: 14px 8px;
            text-align: center;
            font-weight: 800;
            letter-spacing: .06em;
            outline: 0;
            text-shadow: 0 2px 12px rgba(2, 10, 24, .8), 0 0 14px rgba(56, 223, 255, .35);
        }
        .search input::placeholder {
            color: rgba(216, 251, 255, .72);
        }
        .search button,
        .small-btn {
            background: transparent;
            border: 0;
            color: var(--silver);
            font-family: Cinzel, serif;
            font-weight: 800;
            letter-spacing: .14em;
            cursor: pointer;
            text-shadow: 0 0 14px rgba(56, 223, 255, .45);
        }
        .search button:hover,
        .small-btn:hover {
            color: var(--gold);
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin: 22px 0;
        }
        .card {
            background: transparent;
            border: 0;
            padding: 14px 8px;
            text-align: center;
        }
        .icon {
            font-size: 28px;
            filter: drop-shadow(0 0 10px rgba(56, 223, 255, .28));
        }
        .value {
            color: var(--cyan);
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 900;
            text-shadow: 0 2px 14px rgba(2, 10, 24, .85), 0 0 22px rgba(56, 223, 255, .72);
        }
        .label {
            color: var(--soft-cyan);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
            text-shadow: 0 2px 12px rgba(2, 10, 24, .8), 0 0 14px rgba(56, 223, 255, .45);
        }
        .alert,
        .section,
        .message,
        .footer {
            background: transparent;
            border: 0;
            box-shadow: none;
        }
        .alert {
            margin: 12px 0;
            color: var(--soft-cyan);
            font-weight: 800;
            text-shadow: 0 2px 14px rgba(2, 10, 24, .85), 0 0 16px rgba(56, 223, 255, .35);
        }
        .section {
            margin: 24px 0;
        }
        .section-title {
            font-family: Cinzel, serif;
            color: var(--gold);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 18px rgba(244, 197, 66, .3);
        }
        .data {
            color: var(--ice);
            font-weight: 700;
            text-shadow: 0 2px 12px rgba(2, 10, 24, .82), 0 0 14px rgba(56, 223, 255, .28);
        }
        .warning-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--ice);
            font-weight: 800;
            padding: 7px 0;
            text-shadow: 0 2px 12px rgba(2, 10, 24, .82);
        }
        .low {
            color: var(--soft-cyan)
        }
        .medium {
            color: var(--gold)
        }
        .high {
            color: var(--alert)
        }
        .forecast-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: var(--ice);
            text-shadow: 0 2px 12px rgba(2, 10, 24, .8);
        }
        th {
            color: var(--gold);
            font-family: Cinzel, serif;
            letter-spacing: .1em;
            padding: 10px;
        }
        td {
            padding: 8px;
            font-weight: 700;
        }
        .message {
            margin: 28px auto 20px;
            max-width: 920px;
            padding: 16px 0;
            border-top: 1px solid rgba(56, 223, 255, .18);
            border-bottom: 1px solid rgba(56, 223, 255, .18);
            color: var(--ice);
            font-style: italic;
            text-shadow: 0 0 14px rgba(56, 223, 255, .22);
        }
        .message strong {
            color: var(--gold);
            font-family: Cinzel, serif;
            font-style: normal;
        }
        .choice {
            color: var(--gold);
            font-family: Cinzel, serif;
            font-weight: 800;
            letter-spacing: .16em;
            margin: 12px 0 6px;
        }
        .footer {
            margin-top: 22px;
            color: var(--gold);
            font-family: Cinzel, serif;
            font-weight: 700;
            letter-spacing: .12em;
            text-shadow: 0 0 16px rgba(244, 197, 66, .28);
        }
        .motto {
            margin-top: 8px;
            font-size: clamp(17px, 3vw, 28px);
            background: linear-gradient(180deg, #fff, #DFFBFF, #8EF6FF, #426E94);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ===== CẢNH BÁO KHẨN CẤP 63 TỈNH ===== */
        .emergency-section {
            background: rgba(255, 0, 0, 0.08);
            border: 2px solid #FF4444;
            border-radius: 16px;
            padding: 18px 20px;
            margin: 16px 0;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 40px rgba(255, 68, 68, 0.15);
        }
        .emergency-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .emergency-icon {
            font-size: 32px;
        }
        .emergency-title {
            font-family: Cinzel, serif;
            font-size: 22px;
            color: #FF4444;
            flex: 1;
            text-shadow: 0 0 30px rgba(255, 68, 68, 0.3);
        }
        .emergency-badge {
            background: #FF4444;
            color: #fff;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 900;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(0.95);
            }
        }
        .emergency-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
        }
        .emergency-summary .item {
            text-align: center;
        }
        .emergency-summary .label {
            display: block;
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
        }
        .emergency-summary .value {
            display: block;
            font-size: 22px;
            font-weight: 900;
            color: var(--cyan);
        }
        .emergency-summary .value.danger {
            color: #FF4444;
        }
        .table-wrap {
            overflow-x: auto;
            margin-bottom: 12px;
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .table-wrap th {
            background: rgba(255, 255, 255, 0.06);
            color: var(--gold);
            padding: 8px 6px;
            font-size: 11px;
            text-align: center;
        }
        .table-wrap td {
            padding: 8px 6px;
            text-align: center;
            color: var(--ice);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .row-danger td {
            background: rgba(255, 68, 68, 0.2);
        }
        .row-warning td {
            background: rgba(255, 165, 0, 0.12);
        }
        .cell-danger {
            color: #FF4444 !important;
            font-weight: 900;
        }
        .cell-warning {
            color: #FFA500 !important;
            font-weight: 700;
        }
        .emergency-footer {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 10px;
            font-size: 12px;
            color: var(--muted);
        }
        .emergency-footer span {
            opacity: 0.8;
        }
        .emergency-advice {
            margin-top: 12px;
            padding: 14px;
            background: rgba(255, 68, 68, 0.15);
            border-left: 6px solid #FF4444;
            border-radius: 8px;
            text-align: left;
            color: var(--ice);
            font-weight: 600;
            font-size: 15px;
        }
        .emergency-advice strong {
            color: #FF4444;
        }
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding: 12px;
            }
            body::before {
                background-attachment: scroll;
                background-position: center top;
            }
            .container {
                padding: 16px 8px 24px;
            }
            .title {
                letter-spacing: .1em;
            }
            .subtitle {
                letter-spacing: .16em;
            }
            .search {
                grid-template-columns: 1fr;
            }
            .search button {
                padding: 8px 0;
            }
            .cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .warning-item {
                flex-direction: column;
                text-align: center;
                gap: 2px;
            }
            .forecast-head {
                flex-direction: column;
            }
            .small-btn {
                padding: 8px 0;
            }
            th,
            td {
                font-size: 12px;
                padding: 7px 4px;
            }
            .message {
                text-align: left;
                font-size: 15px;
            }
            .emergency-section {
                padding: 12px;
            }
            .emergency-title {
                font-size: 17px;
            }
            .emergency-summary {
                grid-template-columns: repeat(2, 1fr);
            }
            .table-wrap table {
                font-size: 11px;
            }
            .emergency-advice {
                font-size: 13px;
            }
            #countryFlag {
                width: 36px;
            }
        }
    </style>
</head>

        // ================================================================
        //  🔧 HÀM TÍNH TOÁN
        // ================================================================
        const SIGMA_EXT = { A0: 250, K: 2, Q_AVG: 250, YELLOW: 500, RED: 1000 };

        function calcQ(rain, slope) {
            const area = 100,
                coef = 0.4 + slope * 0.3;
            return (rain / 1000) * area * 1e6 * coef / 3600;
        }

        function calcLandslide(total, maxIntensity, slope) {
            let r = 0;
            if (total >= 50) r += 35;
            else if (total >= 30) r += 25;
            else if (total >= 15) r += 15;
            if (maxIntensity >= 15) r += 30;
            else if (maxIntensity >= 8) r += 20;
            else if (maxIntensity >= 4) r += 10;
            return Math.min(r + slope * 35, 100);
        }

        function getLevel(Q, floodRisk) {
            if (Q >= 1000 || floodRisk >= 5000) return { level: '🔴 Cấp cứu', action: 'Sơ tán ngay!', priority: 1,
                color: '#FF4444' };
            if (Q >= 500 || floodRisk >= 2000) return { level: '🟠 Cảnh báo cao', action: 'Chuẩn bị sơ tán', priority: 2,
                color: '#FFA500' };
            if (floodRisk >= 1000) return { level: '🟡 Theo dõi sát', action: 'Theo dõi liên tục', priority: 3,
                color: '#FFD700' };
            return { level: '🟢 An toàn', action: 'Bình thường', priority: 4, color: '#4CAF50' };
        }

        async function fetchRainfallData(lat, lon, days = 5) {
            try {
                const url =
                    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=precipitation&timezone=auto&forecast_days=${days}`;
                const res = await fetch(url);
                const data = await res.json();
                const p = data.hourly?.precipitation || [];
                if (p.length === 0) return { total: 0, maxIntensity: 0 };
                const total = p.slice(0, days * 24).reduce((a, b) => a + b, 0);
                return { total, maxIntensity: Math.max(...p.slice(0, days * 24)) };
            } catch { return { total: 0, maxIntensity: 0 }; }
        }

        // ================================================================
        //  🚨 LOAD CẢNH BÁO KHẨN CẤP
        // ================================================================
        async function loadEmergencyAlert() {
            const container = document.getElementById('emergencyContent');
            if (!container) return;

            container.innerHTML = '⏳ Đang tải dữ liệu 63 tỉnh thành...';

            const results = [];
            for (const p of PROVINCES) {
                const w = await fetchRainfallData(p.lat, p.lon, 5);
                const Q = calcQ(w.total, p.slope);
                const floodRisk = SIGMA_EXT.A0 * Math.exp(SIGMA_EXT.K * (Q - SIGMA_EXT.Q_AVG) / SIGMA_EXT.Q_AVG);
                const landslide = calcLandslide(w.total, w.maxIntensity, p.slope);
                const status = getLevel(Q, floodRisk);
                if (status.priority <= 3) results.push({ ...p, rain: w.total, Q, floodRisk, landslide, status });
            }

            results.sort((a, b) => a.status.priority - b.status.priority);

            if (results.length === 0) {
                container.innerHTML =
                '✅ Hiện tại không có cảnh báo nguy hiểm cho các tỉnh thành Việt Nam. Hãy theo dõi thời tiết thường xuyên.';
                return;
            }

            const totalRain = results.reduce((s, r) => s + r.rain, 0);
            const avgRain = (totalRain / results.length).toFixed(1);

            let html = `
                <div class="emergency-summary">
                    <div class="item"><span class="label">📊 Tổng số tỉnh</span><span class="value">${PROVINCES.length}</span></div>
                    <div class="item"><span class="label">🔴 Cảnh báo</span><span class="value danger">${results.length}</span></div>
                    <div class="item"><span class="label">🌧️ Mưa trung bình</span><span class="value">${avgRain} mm</span></div>
                    <div class="item"><span class="label">🕐 Cập nhật</span><span class="value">${new Date().toLocaleString('vi-VN')}</span></div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr>
                            <th>#</th><th>Tỉnh</th><th>Vùng</th><th>Mưa (mm)</th><th>Q (m³/s)</th><th>Sạt lở (%)</th><th>Cảnh báo</th>
                        </tr></thead>
                        <tbody>
            `;

            results.forEach((r, i) => {
                const rowClass = r.status.priority === 1 ? 'row-danger' : r.status.priority === 2 ? 'row-warning' : '';
                const rainClass = r.rain > 80 ? 'cell-danger' : r.rain > 50 ? 'cell-warning' : '';
                const landClass = r.landslide > 60 ? 'cell-danger' : r.landslide > 30 ? 'cell-warning' : '';
                html += `<tr class="${rowClass}">
                    <td>${i+1}</td>
                    <td><strong>${r.name}</strong></td>
                    <td>${r.region}</td>
                    <td class="${rainClass}">${r.rain.toFixed(1)}</td>
                    <td class="cell-danger">${r.Q.toFixed(1)}</td>
                    <td class="${landClass}">${r.landslide.toFixed(0)}%</td>
                    <td><span style="color:${r.status.color}">${r.status.level}</span><br><small>${r.status.action}</small></td>
                </tr>`;
            });

            html += `
                        </tbody>
                    </table>
                </div>
                <div class="emergency-advice">
                    <strong>🚨 LỜI KHUYÊN KHẨN:</strong><br>
                    • Nếu bạn ở tỉnh có màu <strong>🔴 ĐỎ</strong> – hãy <strong>sơ tán ngay</strong> lên vùng cao.<br>
                    • Tỉnh màu <strong>🟠 CAM</strong> – chuẩn bị sẵn sàng di dời, theo dõi mực nước sông mỗi giờ.<br>
                    • Tỉnh màu <strong>🟡 VÀNG</strong> – theo dõi sát diễn biến mưa và lũ.<br>
                    • Chuẩn bị áo phao, thực phẩm, nước uống cho 3 ngày.
                </div>
                <div class="emergency-footer">
                    <span>📅 Dự báo 5 ngày tới – Tự động cập nhật</span>
                    <span>✅ Dữ liệu từ Open‑Meteo</span>
                </div>
            `;

            container.innerHTML = html;
        }
