<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 SIGMA FOREST – CLIMATE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #1a3a1a 0%, #2d5a2a 40%, #3a6a3a 100%);
            color: #e8f0d0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* === RỪNG TRE === */
        .bamboo-forest {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bamboo-stem {
            position: absolute;
            bottom: 0;
            width: 6px;
            background: linear-gradient(180deg, 
                rgba(60, 120, 60, 0.7) 0%,
                rgba(40, 90, 40, 0.5) 40%,
                rgba(30, 70, 30, 0.3) 100%
            );
            border-radius: 4px 4px 0 0;
            transform-origin: bottom center;
            animation: sway 3s ease-in-out infinite alternate;
        }

        .bamboo-stem::before {
            content: '';
            position: absolute;
            top: 20%;
            left: -2px;
            width: 10px;
            height: 2px;
            background: rgba(80, 140, 70, 0.3);
            border-radius: 2px;
            box-shadow: 0 20px 0 rgba(80, 140, 70, 0.2),
                        0 40px 0 rgba(80, 140, 70, 0.25),
                        0 60px 0 rgba(80, 140, 70, 0.2),
                        0 80px 0 rgba(80, 140, 70, 0.15);
        }

        .bamboo-stem::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 4px;
            width: 8px;
            height: 2px;
            background: rgba(100, 160, 80, 0.2);
            border-radius: 2px;
            box-shadow: 0 30px 0 rgba(100, 160, 80, 0.15),
                        0 50px 0 rgba(100, 160, 80, 0.2),
                        0 70px 0 rgba(100, 160, 80, 0.15);
        }

        .bamboo-leaf {
            position: absolute;
            width: 20px;
            height: 4px;
            background: rgba(80, 160, 70, 0.3);
            border-radius: 50% 50% 50% 0;
            transform-origin: left center;
            animation: leafSway 4s ease-in-out infinite alternate;
        }

        @keyframes sway {
            0% { transform: rotate(-1.5deg); }
            100% { transform: rotate(1.5deg); }
        }

        @keyframes leafSway {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }

        /* === LỚP PHỦ === */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(20, 40, 20, 0.3) 0%, rgba(10, 20, 10, 0.6) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* === CONTAINER === */
        .container {
            max-width: 1100px;
            width: 100%;
            position: relative;
            z-index: 2;
            background: rgba(20, 40, 20, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 30px 35px;
            border: 1px solid rgba(180, 220, 140, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            background: #2e4d2a;
            color: #c8e6b5;
            padding: 6px 24px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid #5a8f4a;
        }

        .header h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ebf5e0;
            margin-top: 6px;
            text-shadow: 0 0 30px rgba(80, 160, 70, 0.2);
        }

        .header h1 span {
            color: #b8d9a0;
            text-shadow: 0 0 20px rgba(180, 220, 140, 0.3);
        }

        .motto {
            font-size: 15px;
            color: #b0cba0;
            font-style: italic;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .characters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px 30px;
            margin: 20px 0 28px;
        }

        .char-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 18px 8px 12px;
            border-radius: 60px;
            border: 1px solid rgba(180, 220, 140, 0.15);
            backdrop-filter: blur(4px);
            transition: 0.3s;
        }

        .char-item:hover {
            transform: translateY(-4px);
            background: rgba(180, 220, 140, 0.1);
            border-color: #b8d9a0;
        }

        .char-item .emoji {
            font-size: 34px;
            line-height: 1;
        }

        .char-item .name {
            font-size: 14px;
            font-weight: 500;
            color: #d0e8c0;
        }

        .search-section {
            margin: 16px 0 24px;
            text-align: center;
        }

        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border-radius: 60px;
            border: none;
            background: rgba(30, 60, 30, 0.6);
            color: #ebf5e0;
            font-size: 16px;
            outline: none;
            border: 1px solid rgba(180, 220, 140, 0.15);
        }

        .search-box input:focus {
            background: rgba(40, 80, 40, 0.7);
            border-color: #8cb87a;
        }

        .search-box input::placeholder {
            color: #88a87a;
        }

        .search-box button {
            padding: 14px 32px;
            border-radius: 60px;
            border: none;
            background: #4d7a3a;
            color: #f0f7e6;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #6a9e56;
        }

        .search-box button:hover {
            background: #5f9248;
            transform: scale(1.02);
        }

        .result-container {
            margin-top: 20px;
        }

        .city-title {
            font-size: 24px;
            font-weight: 600;
            color: #c8e0b8;
            text-align: center;
            margin-bottom: 16px;
        }

        .chart-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .chart-container img {
            max-width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(180, 220, 140, 0.1);
        }

        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(20, 40, 20, 0.4);
            border-radius: 16px;
            overflow: hidden;
        }

        .forecast-table th {
            background: #2a4a2a;
            color: #d0e8c0;
            padding: 12px;
            font-weight: 600;
        }

        .forecast-table td {
            padding: 10px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(180, 220, 140, 0.05);
            color: #d0e0c0;
        }

        .forecast-table tr:hover td {
            background: rgba(180, 220, 140, 0.05);
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #5a7a4a;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(180, 220, 140, 0.08);
        }

        .footer a {
            color: #8cb87a;
            text-decoration: none;
        }

        .footer a:hover {
            color: #b8d9a0;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #88a87a;
            font-size: 18px;
        }

        .error-msg {
            text-align: center;
            padding: 30px;
            color: #e8b0a0;
            font-size: 18px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }
            .header h1 {
                font-size: 28px;
            }
            .search-box input {
                min-width: 120px;
            }
            .characters {
                gap: 10px 14px;
            }
            .char-item {
                padding: 6px 12px 6px 8px;
            }
            .char-item .emoji {
                font-size: 26px;
            }
            .char-item .name {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- RỪNG TRE -->
    <div class="bamboo-forest" id="bambooForest"></div>
    <div class="overlay"></div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="container">
        <div class="header">
            <div class="badge">🌱 Sigma Climate</div>
            <h1>🌿 SIGMA <span>FOREST</span></h1>
            <div class="motto">✨ Peaceful Mind. Kind Heart. Keep Growing.</div>
        </div>

        <div class="characters">
            <div class="char-item"><span class="emoji">💧</span><span class="name">Sigma</span></div>
            <div class="char-item"><span class="emoji">🦗</span><span class="name">Cricket</span></div>
            <div class="char-item"><span class="emoji">🐜</span><span class="name">Little Ant</span></div>
            <div class="char-item"><span class="emoji">🦉</span><span class="name">Professor Owl</span></div>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Nhập tên thành phố..." value="Hanoi">
                <button onclick="loadCityData()">🔍 Tra cứu</button>
            </div>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="loading">🌿 Nhập tên thành phố và nhấn "Tra cứu"</div>
        </div>

        <div class="footer">
            ⚡ Sigma Universe – <a href="https://sigmauniverse.net" target="_blank">sigmauniverse.net</a> &nbsp;|&nbsp; Dữ liệu từ Open-Meteo & NOAA
        </div>
    </div>

    <script>
        // ============================================================
        // TẠO RỪNG TRE BẰNG JAVASCRIPT
        // ============================================================
        (function createBambooForest() {
            const container = document.getElementById('bambooForest');
            const count = 25;

            for (let i = 0; i < count; i++) {
                const stem = document.createElement('div');
                stem.className = 'bamboo-stem';
                
                const left = 2 + Math.random() * 96;
                const height = 60 + Math.random() * 80;
                const width = 4 + Math.random() * 8;
                const delay = Math.random() * 3;
                const duration = 2.5 + Math.random() * 2;
                
                stem.style.left = left + '%';
                stem.style.height = height + '%';
                stem.style.width = width + 'px';
                stem.style.animationDelay = delay + 's';
                stem.style.animationDuration = duration + 's';
                stem.style.opacity = 0.4 + Math.random() * 0.3;
                
                // Lá tre
                const leafCount = 3 + Math.floor(Math.random() * 4);
                for (let j = 0; j < leafCount; j++) {
                    const leaf = document.createElement('div');
                    leaf.className = 'bamboo-leaf';
                    const leafTop = 10 + Math.random() * 70;
                    const leafLeft = -10 + Math.random() * 15;
                    const leafWidth = 15 + Math.random() * 20;
                    const leafDelay = Math.random() * 4;
                    leaf.style.top = leafTop + '%';
                    leaf.style.left = leafLeft + 'px';
                    leaf.style.width = leafWidth + 'px';
                    leaf.style.height = (3 + Math.random() * 3) + 'px';
                    leaf.style.animationDelay = leafDelay + 's';
                    leaf.style.animationDuration = (3 + Math.random() * 3) + 's';
                    leaf.style.opacity = 0.2 + Math.random() * 0.3;
                    leaf.style.background = `rgba(${80 + Math.random() * 60}, ${160 + Math.random() * 60}, ${70 + Math.random() * 40}, 0.3)`;
                    stem.appendChild(leaf);
                }
                
                container.appendChild(stem);
            }
        })();

        // ============================================================
        // HÀM TẢI DỮ LIỆU THÀNH PHỐ
        // ============================================================
        function loadCityData() {
            const input = document.getElementById('cityInput');
            const city = input.value.trim() || "Hanoi";
            const resultDiv = document.getElementById('resultContainer');

            const safeName = city.toLowerCase().replace(/ /g, '_').replace(/'/g, '');
            const imgUrl = `data/${safeName}_temperature_trend.png`;
            const csvUrl = `data/${safeName}_forecast_2025_2034.csv`;

            resultDiv.innerHTML = `<div class="loading">⏳ Đang tải dữ liệu cho ${city}...</div>`;

            fetch(imgUrl, { method: 'HEAD' })
                .then(res => {
                    if (res.ok) {
                        displayResult(city, imgUrl, csvUrl);
                    } else {
                        const altName = city.toLowerCase().replace(/ /g, '_');
                        const altImg = `data/${altName}_temperature_trend.png`;
                        fetch(altImg, { method: 'HEAD' })
                            .then(res2 => {
                                if (res2.ok) {
                                    displayResult(city, altImg, `data/${altName}_forecast_2025_2034.csv`);
                                } else {
                                    resultDiv.innerHTML = `<div class="error-msg">❌ Không tìm thấy dữ liệu cho "${city}".<br>Hãy thử một thành phố khác.</div>`;
                                }
                            })
                            .catch(() => {
                                resultDiv.innerHTML = `<div class="error-msg">❌ Không tìm thấy dữ liệu cho "${city}".</div>`;
                            });
                    }
                })
                .catch(() => {
                    resultDiv.innerHTML = `<div class="error-msg">❌ Không tìm thấy dữ liệu cho "${city}".</div>`;
                });
        }

        function displayResult(city, imgUrl, csvUrl) {
            const resultDiv = document.getElementById('resultContainer');

            let html = `
                <div class="city-title">📍 ${city.toUpperCase()}</div>
                <div class="chart-container">
                    <img src="${imgUrl}" alt="Temperature trend for ${city}" onerror="this.style.display='none'">
                </div>
                <div style="text-align:center;color:#88a87a;font-size:14px;margin-bottom:12px;">
                    📊 Xu hướng nhiệt độ 2015-2034 | 🔮 Dự báo 2025-2034
                </div>
            `;

            fetch(csvUrl)
                .then(res => res.text())
                .then(text => {
                    const lines = text.trim().split('\n');
                    if (lines.length > 1) {
                        html += `<table class="forecast-table">
                            <tr><th>Năm</th><th>Nhiệt độ dự báo (°C)</th></tr>`;
                        for (let i = 1; i < lines.length && i <= 10; i++) {
                            const cols = lines[i].split(',');
                            if (cols.length >= 2) {
                                html += `<tr><td>${cols[0]}</td><td>${parseFloat(cols[1]).toFixed(2)}°C</td></tr>`;
                            }
                        }
                        html += `</table>`;
                    }
                    resultDiv.innerHTML = html;
                })
                .catch(() => {
                    resultDiv.innerHTML = html + `<div style="color:#88a87a;text-align:center;padding:12px;">ℹ️ Không có dữ liệu bảng dự báo.</div>`;
                });
        }

        window.onload = loadCityData;
    </script>
</body>
</html>
