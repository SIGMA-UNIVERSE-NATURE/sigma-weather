<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 SIGMA UNIVERSE – WEATHER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a1e3f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #ffffff10;
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #ffffff20;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .header h1 span { color: #ffd700; }
        .header .motto {
            font-size: 14px;
            color: #aac;
            margin-top: 4px;
            font-style: italic;
        }
        .characters {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 16px 0 24px 0;
        }
        .char-item {
            text-align: center;
            font-size: 13px;
            color: #ccd;
        }
        .char-item .emoji {
            font-size: 42px;
            display: block;
        }
        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .search-box input, .search-box select {
            flex: 1;
            padding: 14px 18px;
            border-radius: 40px;
            border: none;
            background: #ffffff20;
            color: #fff;
            font-size: 16px;
            outline: none;
            min-width: 150px;
        }
        .search-box input::placeholder { color: #aac; }
        .search-box button {
            padding: 14px 30px;
            border-radius: 40px;
            border: none;
            background: #ffd700;
            color: #0a1e3f;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .search-box button:hover { background: #f0c800; }
        .card {
            background: #ffffff10;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border-left: 6px solid #ffd700;
            transition: 0.3s;
        }
        .card.critical { border-color: #e74c3c; }
        .card.warning { border-color: #e67e22; }
        .card.caution { border-color: #f1c40f; }
        .card.normal { border-color: #2ecc71; }
        .card .time { font-size: 14px; color: #aac; }
        .card .temp { font-size: 28px; font-weight: 700; }
        .card .desc { font-size: 16px; margin-top: 6px; }
        .card .advice { font-size: 14px; color: #dde; margin-top: 8px; }
        .footer {
            text-align: center;
            font-size: 13px;
            color: #668;
            margin-top: 20px;
            border-top: 1px solid #ffffff20;
            padding-top: 20px;
        }
        .footer a { color: #ffd700; text-decoration: none; }
        .loading { text-align: center; padding: 40px; color: #aac; }
        .sigma-badge {
            display: inline-block;
            background: #ffd700;
            color: #0a1e3f;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .header h1 { font-size: 24px; }
            .characters { gap: 16px; }
            .char-item .emoji { font-size: 32px; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header">
        <div class="sigma-badge">Σ SIGMA UNIVERSE</div>
        <h1>🌤️ <span>WEATHER</span></h1>
        <div class="motto">✨ Peaceful Mind. Kind Heart. Keep Growing.</div>
    </div>

    <!-- NHÂN VẬT SIGMA -->
    <div class="characters">
        <div class="char-item"><span class="emoji">💧</span> Sigma</div>
        <div class="char-item"><span class="emoji">🦗</span> Cricket</div>
        <div class="char-item"><span class="emoji">🐜</span> Little Ant</div>
        <div class="char-item"><span class="emoji">🦉</span> Professor Owl</div>
    </div>

    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Nhập thành phố..." value="Hanoi">
        <select id="daysSelect">
            <option value="1">Hôm nay</option>
            <option value="3">3 ngày</option>
            <option value="5" selected>5 ngày</option>
        </select>
        <button onclick="getWeather()">🔍 Dự báo</button>
    </div>

    <div id="result">
        <div class="loading">⏳ Nhập thành phố và nhấn Dự báo...</div>
    </div>

    <div class="footer">
        ⚡ Sigma Universe – <a href="https://sigmauniverse.net" target="_blank">sigmauniverse.net</a> &nbsp;|&nbsp; Dữ liệu từ OpenWeather
    </div>
</div>

<script>
const API_KEY = "3fd10b85eec53ba4d40b2f5ec0ff197c";

function getWeather() {
    const city = document.getElementById('cityInput').value.trim() || "Hanoi";
    const days = parseInt(document.getElementById('daysSelect').value);
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = `<div class="loading">⏳ Đang lấy dữ liệu cho ${city}...</div>`;

    fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=metric&lang=vi`)
        .then(res => res.json())
        .then(data => {
            if (data.cod !== "200" || !data.list) {
                resultDiv.innerHTML = `<div class="card normal">⚠️ Không tìm thấy thành phố. Vui lòng kiểm tra lại.</div>`;
                return;
            }

            const cityName = data.city.name;
            const items = data.list.slice(0, days * 8);
            let html = `<div style="margin-bottom:12px;color:#aac;">📍 ${cityName.toUpperCase()} – ${days} ngày</div>`;

            items.forEach(item => {
                const time = new Date(item.dt * 1000);
                const timeStr = time.toLocaleString('vi-VN', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
                const temp = Math.round(item.main.temp);
                const humidity = item.main.humidity;
                const wind = item.wind.speed;
                const desc = item.weather[0].description;
                const level = getLevel(temp, humidity, wind, desc);
                const advice = getAdvice(temp, humidity, wind, desc);
                html += `
                    <div class="card ${level.class}">
                        <div class="time">🕐 ${timeStr}</div>
                        <div class="temp">${temp}°C</div>
                        <div class="desc">🌥️ ${desc} | Độ ẩm: ${humidity}% | Gió: ${wind} m/s</div>
                        <div class="advice">💡 ${level.icon} ${advice}</div>
                    </div>
                `;
            });

            resultDiv.innerHTML = html;
        })
        .catch(err => {
            resultDiv.innerHTML = `<div class="card normal">⚠️ Lỗi kết nối. Vui lòng thử lại.</div>`;
        });
}

function getLevel(temp, humidity, wind, desc) {
    const d = desc.toLowerCase();
    if (d.includes('mưa') || d.includes('dông')) {
        if (wind > 10) return { class: 'critical', icon: '🔴' };
        return { class: 'warning', icon: '🟠' };
    }
    if (temp > 38) return { class: 'critical', icon: '🔴' };
    if (temp > 35) return { class: 'warning', icon: '🟠' };
    if (humidity > 85) return { class: 'caution', icon: '🟡' };
    if (wind > 10) return { class: 'caution', icon: '🟡' };
    return { class: 'normal', icon: '🟢' };
}

function getAdvice(temp, humidity, wind, desc) {
    const d = desc.toLowerCase();
    if (d.includes('mưa') || d.includes('dông')) {
        if (wind > 10) return 'Bão hoặc dông mạnh. Tìm nơi trú ẩn an toàn ngay!';
        return 'Trời sắp mưa. Mang theo ô và tránh ra đường.';
    }
    if (temp > 38) return 'Nắng nóng cực đoan. Hạn chế ra ngoài, uống nhiều nước.';
    if (temp > 35) return 'Nắng nóng. Mang ô, uống đủ nước.';
    if (humidity > 85) return 'Độ ẩm cao. Có thể mưa, mang theo ô.';
    if (wind > 10) return 'Gió mạnh. Cẩn thận với cây cối, biển báo.';
    return 'Thời tiết ổn định. Không có gì đáng lo.';
}

window.onload = getWeather;
</script>
</body>
</html>
