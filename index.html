<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌿 SIGMA CLIMATE – Global Weather Forecast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0a1a0a;
            color: #e8f0d0;
        }

        /* ---- BACKGROUND RỪNG TRE + NHÂN VẬT SIGMA ---- */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/images/background.jpg') center/cover no-repeat fixed;
           /* filter: brightness(0.7) saturate(0.9); */
            z-index: 0;
        }

        /* LỚP PHỦ MỜ ĐỂ NHÂN VẬT NỔI BẬT */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 30, 10, 0.35);
           /* backdrop-filter: blur(2px); */
            z-index: 1;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            position: relative;
            z-index: 2;
            background: rgba(20, 40, 20, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 30px 35px;
            border: 1px solid rgba(180, 220, 140, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            background: #2e4d2a;
            color: #c8e6b5;
            padding: 6px 24px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid #5a8f4a;
        }

        .header h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ebf5e0;
            margin-top: 6px;
        }

        .header h1 span {
            color: #b8d9a0;
            text-shadow: 0 0 20px rgba(180, 220, 140, 0.3);
        }

        .motto {
            font-size: 15px;
            color: #b0cba0;
            font-style: italic;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        /* ---- BIỂU TƯỢNG THỜI TIẾT ---- */
        .weather-icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 20px 0 28px;
        }

        .weather-icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid rgba(180, 220, 140, 0.15);
            transition: 0.3s;
        }

        .weather-icon-item:hover {
            transform: translateY(-4px);
            background: rgba(180, 220, 140, 0.1);
            border-color: #b8d9a0;
        }

        .weather-icon-item .icon {
            font-size: 32px;
            line-height: 1;
        }

        .weather-icon-item .label {
            font-size: 13px;
            font-weight: 500;
            color: #d0e8c0;
        }

        /* ---- TÌM KIẾM ---- */
        .search-section {
            margin: 16px 0 24px;
            text-align: center;
        }

        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .search-box select,
        .search-box input {
            flex: 1;
            min-width: 180px;
            padding: 14px 20px;
            border-radius: 60px;
            border: none;
            background: rgba(30, 60, 30, 0.6);
            color: #ebf5e0;
            font-size: 16px;
            outline: none;
            border: 1px solid rgba(180, 220, 140, 0.15);
        }

        .search-box select:focus,
        .search-box input:focus {
            background: rgba(40, 80, 40, 0.7);
            border-color: #8cb87a;
        }

        .search-box select option {
            background: #1a3a1a;
            color: #ebf5e0;
        }

        .search-box button {
            padding: 14px 32px;
            border-radius: 60px;
            border: none;
            background: #4d7a3a;
            color: #f0f7e6;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #6a9e56;
        }

        .search-box button:hover {
            background: #5f9248;
            transform: scale(1.02);
        }

        /* ---- KẾT QUẢ ---- */
        .result-container {
            margin-top: 20px;
        }

        .city-title {
            font-size: 24px;
            font-weight: 600;
            color: #c8e0b8;
            text-align: center;
            margin-bottom: 16px;
        }

        .chart-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .chart-container img {
            max-width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(180, 220, 140, 0.1);
        }

        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(20, 40, 20, 0.4);
            border-radius: 16px;
            overflow: hidden;
        }

        .forecast-table th {
            background: #2a4a2a;
            color: #d0e8c0;
            padding: 12px;
            font-weight: 600;
        }

        .forecast-table td {
            padding: 10px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(180, 220, 140, 0.05);
            color: #d0e0c0;
        }

        .forecast-table tr:hover td {
            background: rgba(180, 220, 140, 0.05);
        }

        .warning-box {
            margin: 16px 0 20px;
            padding: 16px 24px;
            border-radius: 16px;
            font-weight: 600;
            text-align: center;
        }

        .warning-box.green {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #a3e4d7;
        }

        .warning-box.yellow {
            background: rgba(241, 196, 15, 0.2);
            border: 1px solid #f1c40f;
            color: #f9e79f;
        }

        .warning-box.red {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #f1948a;
        }

        .download-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 24px;
            background: #2e4d2a;
            color: #c8e6b5;
            border: 1px solid #5a8f4a;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .download-btn:hover {
            background: #3d6a38;
            transform: scale(1.02);
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #5a7a4a;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(180, 220, 140, 0.08);
        }

        .footer a {
            color: #8cb87a;
            text-decoration: none;
        }

        .footer a:hover {
            color: #b8d9a0;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #88a87a;
            font-size: 18px;
        }

        .error-msg {
            text-align: center;
            padding: 30px;
            color: #e8b0a0;
            font-size: 18px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }
            .header h1 {
                font-size: 28px;
            }
            .search-box select,
            .search-box input {
                min-width: 120px;
            }
            .weather-icons {
                gap: 12px;
            }
            .weather-icon-item {
                padding: 4px 12px;
            }
            .weather-icon-item .icon {
                font-size: 24px;
            }
            .weather-icon-item .label {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="badge">🌱 Sigma Climate</div>
            <h1>🌿 SIGMA <span>FOREST</span></h1>
            <div class="motto">✨ Peaceful Mind. Kind Heart. Keep Growing.</div>
        </div>

        <!-- WEATHER ICONS -->
        <div class="weather-icons">
            <div class="weather-icon-item"><span class="icon">☀️</span><span class="label">Sunny</span></div>
            <div class="weather-icon-item"><span class="icon">🌧️</span><span class="label">Rainy</span></div>
            <div class="weather-icon-item"><span class="icon">💨</span><span class="label">Windy</span></div>
            <div class="weather-icon-item"><span class="icon">⛈️</span><span class="label">Storm</span></div>
        </div>

        <!-- SEARCH + YEAR SELECTOR -->
        <div class="search-section">
            <div class="search-box">
                <select id="citySelect">
                    <option value="Hanoi">Hanoi</option>
                    <option value="Ho Chi Minh City">Ho Chi Minh City</option>
                    <option value="Da Nang">Da Nang</option>
                    <option value="Hai Phong">Hai Phong</option>
                    <option value="Can Tho">Can Tho</option>
                    <option value="Tokyo">Tokyo</option>
                    <option value="Osaka">Osaka</option>
                    <option value="Seoul">Seoul</option>
                    <option value="Busan">Busan</option>
                    <option value="Beijing">Beijing</option>
                    <option value="Shanghai">Shanghai</option>
                    <option value="Hong Kong">Hong Kong</option>
                    <option value="Singapore">Singapore</option>
                    <option value="Kuala Lumpur">Kuala Lumpur</option>
                    <option value="Jakarta">Jakarta</option>
                    <option value="Bangkok">Bangkok</option>
                    <option value="Manila">Manila</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Dubai">Dubai</option>
                    <option value="Istanbul">Istanbul</option>
                    <option value="London">London</option>
                    <option value="Paris">Paris</option>
                    <option value="Berlin">Berlin</option>
                    <option value="Madrid">Madrid</option>
                    <option value="Rome">Rome</option>
                    <option value="Moscow">Moscow</option>
                    <option value="New York">New York</option>
                    <option value="Los Angeles">Los Angeles</option>
                    <option value="Chicago">Chicago</option>
                    <option value="Toronto">Toronto</option>
                    <option value="Mexico City">Mexico City</option>
                    <option value="Sao Paulo">Sao Paulo</option>
                    <option value="Rio de Janeiro">Rio de Janeiro</option>
                    <option value="Buenos Aires">Buenos Aires</option>
                    <option value="Lima">Lima</option>
                    <option value="Bogota">Bogota</option>
                    <option value="Cairo">Cairo</option>
                    <option value="Lagos">Lagos</option>
                    <option value="Nairobi">Nairobi</option>
                    <option value="Cape Town">Cape Town</option>
                    <option value="Johannesburg">Johannesburg</option>
                    <option value="Sydney">Sydney</option>
                    <option value="Melbourne">Melbourne</option>
                    <option value="Auckland">Auckland</option>
                </select>
                <select id="yearSelect">
                    <option value="1">1 Year</option>
                    <option value="2">2 Years</option>
                    <option value="3">3 Years</option>
                    <option value="5" selected>5 Years</option>
                    <option value="10">10 Years</option>
                </select>
                <button onclick="loadCityData()">🔍 Search</button>
            </div>
        </div>

        <!-- RESULT -->
        <div class="result-container" id="resultContainer">
            <div class="loading">🌿 Select a city and click "Search"</div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            ⚡ <a href="https://sigmauniverse.net" target="_blank">Sigma Universe</a> – <a href="https://sigmaclimate.net" target="_blank">sigmaclimate.net</a> &nbsp;|&nbsp; Data from Open-Meteo & NOAA
        </div>
    </div>

    <script>
        // ============================================================
        // LOAD CITY DATA
        // ============================================================
        function loadCityData() {
            const city = document.getElementById('citySelect').value;
            const years = parseInt(document.getElementById('yearSelect').value);
            const resultDiv = document.getElementById('resultContainer');

            const safeName = city.toLowerCase().replace(/ /g, '_').replace(/'/g, '');
            const imgUrl = `data/${safeName}_temperature_trend.png`;
            const csvUrl = `data/${safeName}_forecast_2025_2034.csv`;

            resultDiv.innerHTML = `<div class="loading">⏳ Loading data for ${city}...</div>`;

            fetch(imgUrl, { method: 'HEAD' })
                .then(res => {
                    if (res.ok) {
                        displayResult(city, imgUrl, csvUrl, years);
                    } else {
                        const altName = city.toLowerCase().replace(/ /g, '_');
                        const altImg = `data/${altName}_temperature_trend.png`;
                        fetch(altImg, { method: 'HEAD' })
                            .then(res2 => {
                                if (res2.ok) {
                                    displayResult(city, altImg, `data/${altName}_forecast_2025_2034.csv`, years);
                                } else {
                                    resultDiv.innerHTML = `<div class="error-msg">❌ No data found for "${city}".<br>Please try another city.</div>`;
                                }
                            })
                            .catch(() => {
                                resultDiv.innerHTML = `<div class="error-msg">❌ No data found for "${city}".</div>`;
                            });
                    }
                })
                .catch(() => {
                    resultDiv.innerHTML = `<div class="error-msg">❌ No data found for "${city}".</div>`;
                });
        }

        function displayResult(city, imgUrl, csvUrl, years) {
            const resultDiv = document.getElementById('resultContainer');

            fetch(csvUrl)
                .then(res => res.text())
                .then(text => {
                    const lines = text.trim().split('\n');
                    let forecastData = [];
                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(',');
                        if (cols.length >= 2) {
                            forecastData.push({ year: parseInt(cols[0]), temp: parseFloat(cols[1]) });
                        }
                    }

                    // Lấy dữ liệu trong khoảng số năm đã chọn
                    const startYear = 2025;
                    const endYear = startYear + years - 1;
                    const filtered = forecastData.filter(d => d.year >= startYear && d.year <= endYear);

                    // Tính tốc độ tăng nhiệt độ (slope)
                    let warningLevel = 'green';
                    let warningMessage = '✅ Climate in this region is stable.';
                    let slope = 0;
                    if (forecastData.length > 1) {
                        const n = forecastData.length;
                        const sumX = forecastData.reduce((s, d) => s + d.year, 0);
                        const sumY = forecastData.reduce((s, d) => s + d.temp, 0);
                        const sumXY = forecastData.reduce((s, d) => s + d.year * d.temp, 0);
                        const sumX2 = forecastData.reduce((s, d) => s + d.year * d.year, 0);
                        slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
                        if (slope > 0.03) {
                            warningLevel = 'red';
                            warningMessage = '🔴 WARNING: This region is warming faster than the global average (> 0.03°C/year). Prepare for more extreme summers.';
                        } else if (slope > 0.02) {
                            warningLevel = 'yellow';
                            warningMessage = '🟡 CAUTION: This region is showing signs of warming. Monitor closely.';
                        } else {
                            warningMessage = '✅ Climate in this region is stable.';
                        }
                    }

                    let html = `
                        <div class="city-title">📍 ${city.toUpperCase()}</div>
                        <div class="chart-container">
                            <img src="${imgUrl}" alt="Temperature trend for ${city}" onerror="this.style.display='none'">
                        </div>
                        <div style="text-align:center;color:#88a87a;font-size:14px;margin-bottom:12px;">
                            📊 Temperature trend 2015-2034 | 🔮 Forecast ${startYear}-${endYear}
                        </div>
                        <div class="warning-box ${warningLevel}">
                            ${warningMessage}
                            ${slope !== 0 ? ` (Trend: ${slope.toFixed(4)}°C/year)` : ''}
                        </div>
                        <div style="text-align:center;margin-bottom:12px;">
                            <button class="download-btn" onclick="downloadCSV('${city}', '${csvUrl}')">⬇️ Download CSV</button>
                        </div>
                    `;

                    if (filtered.length > 0) {
                        html += `<table class="forecast-table">
                            <tr><th>Year</th><th>Forecast Temperature (°C)</th></tr>`;
                        filtered.forEach(d => {
                            html += `<tr><td>${d.year}</td><td>${d.temp.toFixed(2)}°C</td></tr>`;
                        });
                        html += `</table>`;
                    } else {
                        html += `<div style="color:#88a87a;text-align:center;padding:12px;">ℹ️ No forecast data available for the selected time range.</div>`;
                    }

                    resultDiv.innerHTML = html;
                })
                .catch(() => {
                    resultDiv.innerHTML = `<div class="error-msg">❌ No forecast data available for "${city}".</div>`;
                });
        }

        function downloadCSV(city, csvUrl) {
            fetch(csvUrl)
                .then(res => res.text())
                .then(text => {
                    const blob = new Blob([text], { type: 'text/csv' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `${city.toLowerCase()}_forecast.csv`;
                    link.click();
                })
                .catch(() => alert('Could not download CSV.'));
        }

        window.onload = loadCityData;
    </script>
</body>
</html>
